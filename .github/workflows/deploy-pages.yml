name: Publish lab prompts
on:
  push:
    branches: [main]
    paths: ['docs/prompts/**', 'labs/**', '.github/workflows/deploy-pages.yml']
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Prepare public lab site
        run: |
          mkdir -p _site/prompts
          cp docs/prompts/index.html _site/prompts/index.html
          cp -R labs _site/labs
          printf '<!doctype html><meta charset="utf-8"><meta http-equiv="refresh" content="0;url=prompts/"><title>C27 Lab Prompts</title><a href="prompts/">Open the lab prompts</a>' > _site/index.html
          touch _site/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - uses: actions/deploy-pages@v4
        id: deployment
